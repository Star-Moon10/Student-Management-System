name: Publish controlled update

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches VERSION
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Audit public source
        run: python scripts/audit_public_source.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build update package
        run: python scripts/build_release.py --output dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dist/release-notes.md
          files: |
            dist/student-management-update.zip
            dist/student-management-update.zip.sha256
