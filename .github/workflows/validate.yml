name: Validate public source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Audit public source
        run: python scripts/audit_public_source.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate POSIX shell scripts
        run: bash -n setup.sh start-system.sh stop-system.sh scripts/update-system.sh scripts/setup-project-ai.sh scripts/start-project-ai.sh scripts/stop-project-ai.sh
      - name: Validate release builder
        run: python scripts/build_release.py --output dist
