[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-management-system"
version = "0.1.0"
description = "Secure student information management system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[argon2]>=1.7,<2.0",
  "jinja2>=3.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "truststore>=0.10,<1.0",
  "cryptography>=43.0,<46.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
